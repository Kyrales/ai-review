agent:
  enabled: false
core:
  concurrency: 4
review:
  mode: ADDED_AND_REMOVED_WITH_CONTEXT
  context_lines: 12
  max_inline_comments: 20
  inline_comment_fallback: true
  ignore_1c_role_restriction_templates:
    - "ПоЗначениям"
    - "ПоЗначениямРасширенный"
    - "ПоЗначениямИНаборамРасширенный"
  allow_changes: ["src/cf/sppr/**", "src/cfe/YAXUNIT/**", "doc/**/*.md", "*.md"]
  ignore_changes: ["**/Help/**", "**/Pictures/**", "**/*.png", "**/*.jpg", "**/*.gif", "**/*.pdf", "**/*.epf", "**/*.erf", "build/**"]
prompt:
  inline_prompt_files: [/opt/ai-review-ci/sppr/prompts/inline.md, /opt/ai-review-ci/sppr/prompts/project-rules.md]
  context_prompt_files: [/opt/ai-review-ci/sppr/prompts/context.md, /opt/ai-review-ci/sppr/prompts/project-rules.md]
  summary_prompt_files: [/opt/ai-review-ci/sppr/prompts/summary.md, /opt/ai-review-ci/sppr/prompts/project-rules.md]
  inline_reply_prompt_files: [/opt/ai-review-ci/sppr/prompts/followup.md, /opt/ai-review-ci/sppr/prompts/project-rules.md]
  include_inline_system_prompts: true
  include_context_system_prompts: true
  include_summary_system_prompts: true
  include_inline_reply_system_prompts: true
vcs:
  pagination:
    max_pages: 10
artifacts:
  llm_dir: /artifacts/llm
  vcs_dir: /artifacts/vcs
  llm_enabled: false
  vcs_enabled: false
